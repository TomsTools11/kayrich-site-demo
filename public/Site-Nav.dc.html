<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  .kr-mnav-bar,.kr-mnav-panel{display:none}
  .kr-mnav-panel{max-height:calc(100vh - 73px);max-height:calc(100dvh - 73px);overflow-y:auto;overscroll-behavior:contain}
  @media (max-width: 860px){
    .kr-nav-desktop{display:none !important}
    .kr-mnav-bar{display:flex}
    .kr-mnav-panel{display:block}
  }
</style>
</helmet>
<header style="position:sticky;top:0;z-index:40;background:rgba(245,247,246,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(14,55,51,.09)">

    <a href="Home.dc.html" style="flex:none;display:block;line-height:0;text-decoration:none" aria-label="KayRich Insurance Agency, home">
      <img src="assets/kayrich-logo.png" alt="KayRich Insurance Agency" width="640" height="330" style="display:block;height:52px;width:auto">
    </a>
    <nav aria-label="Primary" class="kr-nav-desktop" style="flex:1 1 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:clamp(12px,1.6vw,24px);font-family:Geist,sans-serif;font-size:14.5px;font-weight:500;letter-spacing:-.005em">

      <div style="position:relative" onMouseEnter="{{ openMenu }}" onMouseLeave="{{ closeMenu }}">
        <button type="button" aria-haspopup="true" aria-expanded="{{ coverageOpen }}" onClick="{{ toggleMenu }}" style="display:inline-flex;align-items:center;gap:6px;background:none;border:none;padding:6px 2px;cursor:pointer;color:#26403C;font-family:Geist,sans-serif;font-size:14.5px;font-weight:500;border-bottom:1.5px solid transparent;white-space:nowrap" style-hover="color:#0E3733;border-bottom-color:#7CD1CA">

          <div style="position:absolute;top:100%;right:0;padding-top:12px;min-width:236px;animation:kr-fade .16s ease both">
          <div style="background:#FFFFFF;border:1px solid rgba(14,55,51,.12);border-radius:16px;box-shadow:0 22px 50px -24px rgba(14,55,51,.38);padding:10px;display:flex;flex-direction:column;gap:2px">
            <a href="Auto-Insurance.dc.html" style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#26403C;text-decoration:none;white-space:nowrap" style-hover="background:#E6F2F0;color:#0E3733"><i class="ph ph-car-profile" style="font-size:18px;color:#155E56"></i>Auto insurance</a>
            <a href="Home-Insurance.dc.html" style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#26403C;text-decoration:none;white-space:nowrap" style-hover="background:#E6F2F0;color:#0E3733"><i class="ph ph-house-line" style="font-size:18px;color:#155E56"></i>Home insurance</a>
            <a href="Life-Insurance.dc.html" style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#26403C;text-decoration:none;white-space:nowrap" style-hover="background:#E6F2F0;color:#0E3733"><i class="ph ph-heart" style="font-size:18px;color:#155E56"></i>Life insurance</a>
            <a href="Business-Insurance.dc.html" style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#26403C;text-decoration:none;white-space:nowrap" style-hover="background:#E6F2F0;color:#0E3733"><i class="ph ph-storefront" style="font-size:18px;color:#155E56"></i>Business insurance</a>
            <a href="Race-Car-Insurance.dc.html" style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#26403C;text-decoration:none;white-space:nowrap" style-hover="background:#E6F2F0;color:#0E3733"><i class="ph ph-flag-checkered" style="font-size:18px;color:#155E56"></i>Race car insurance</a>
          </div>
          </div>
        </sc-if>
      </div>

      <a href="Service-Area.dc.html" style="color:#26403C;text-decoration:none;white-space:nowrap;padding:6px 2px;border-bottom:1.5px solid transparent" style-hover="color:#0E3733;border-bottom-color:#7CD1CA">Service Area</a>
      <a href="About.dc.html" style="color:#26403C;text-decoration:none;white-space:nowrap;padding:6px 2px;border-bottom:1.5px solid transparent" style-hover="color:#0E3733;border-bottom-color:#7CD1CA">About</a>
      <a href="Reviews.dc.html" style="color:#26403C;text-decoration:none;white-space:nowrap;padding:6px 2px;border-bottom:1.5px solid transparent" style-hover="color:#0E3733;border-bottom-color:#7CD1CA">Reviews</a>
      <a href="Contact.dc.html" style="color:#26403C;text-decoration:none;white-space:nowrap;padding:6px 2px;border-bottom:1.5px solid transparent" style-hover="color:#0E3733;border-bottom-color:#7CD1CA">Contact</a>
      <a role="button" tabindex="0" data-demo-inert="call" style="display:inline-flex;align-items:center;gap:8px;background:#0E3733;color:#FFFFFF;text-decoration:none;font-family:Geist,sans-serif;font-size:14.5px;font-weight:600;padding:11px 20px;border-radius:999px;white-space:nowrap;transition:background .2s cubic-bezier(.16,1,.3,1),transform .12s ease" style-hover="background:#155E56" style-active="transform:scale(.98)">
        <i class="ph ph-phone-call" style="font-size:17px;color:#7CD1CA"></i>Call (214) 773-3938
      </a>
    </nav>

    <div class="kr-mnav-bar" style="margin-left:auto;align-items:center;gap:10px">
      <a role="button" tabindex="0" data-demo-inert="call" aria-label="Call (214) 773-3938" style="width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;background:#0E3733;border-radius:999px;text-decoration:none;transition:background .2s cubic-bezier(.16,1,.3,1),transform .12s ease" style-hover="background:#155E56" style-active="transform:scale(.96)">
        <i class="ph ph-phone-call" style="font-size:20px;color:#7CD1CA"></i>
      </a>
      <button type="button" aria-controls="kr-mobile-menu" aria-expanded="{{ mobileOpen }}" aria-label="{{ mobileMenuLabel }}" onClick="{{ toggleMobile }}" style="height:44px;display:inline-flex;align-items:center;gap:8px;padding:0 16px 0 14px;background:#FFFFFF;border:1px solid rgba(14,55,51,.18);border-radius:999px;cursor:pointer;color:#0E3733;font-family:Geist,sans-serif;font-size:15px;font-weight:600;transition:border-color .2s ease,background .2s ease" style-hover="border-color:#7CD1CA;background:#F2F8F7">
        <sc-if value="{{ mobileOpen }}" hint-placeholder-val="{{ false }}"><i class="ph ph-x" style="font-size:19px"></i>Close</sc-if>
        <sc-if value="{{ mobileClosed }}" hint-placeholder-val="{{ true }}"><i class="ph ph-list" style="font-size:19px"></i>Menu</sc-if>
      </button>
    </div>
  </div>

  <sc-if value="{{ mobileOpen }}" hint-placeholder-val="{{ false }}">
    <div id="kr-mobile-menu" class="kr-mnav-panel" style="border-top:1px solid rgba(14,55,51,.09);background:#FFFFFF;animation:kr-fade .16s ease both">
      <nav aria-label="Mobile" style="max-width:1340px;margin:0 auto;padding:12px clamp(18px,3.4vw,44px) 22px;display:flex;flex-direction:column;gap:2px;font-family:Geist,sans-serif;font-size:16px;font-weight:500;letter-spacing:-.005em">
        <p style="margin:6px 12px 4px;font-family:'Geist Mono',ui-monospace,monospace;font-size:11.5px;font-weight:500;letter-spacing:.16em;color:#155E56;text-transform:uppercase">Coverage</p>
        <a href="Auto-Insurance.dc.html" style="display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:#26403C;text-decoration:none" style-hover="background:#E6F2F0;color:#0E3733"><i class="ph ph-car-profile" style="font-size:20px;color:#155E56"></i>Auto insurance</a>
        <a href="Home-Insurance.dc.html" style="display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:#26403C;text-decoration:none" style-hover="background:#E6F2F0;color:#0E3733"><i class="ph ph-house-line" style="font-size:20px;color:#155E56"></i>Home insurance</a>
        <a href="Life-Insurance.dc.html" style="display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:#26403C;text-decoration:none" style-hover="background:#E6F2F0;color:#0E3733"><i class="ph ph-heart" style="font-size:20px;color:#155E56"></i>Life insurance</a>
        <a href="Business-Insurance.dc.html" style="display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:#26403C;text-decoration:none" style-hover="background:#E6F2F0;color:#0E3733"><i class="ph ph-storefront" style="font-size:20px;color:#155E56"></i>Business insurance</a>
        <a href="Race-Car-Insurance.dc.html" style="display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:#26403C;text-decoration:none" style-hover="background:#E6F2F0;color:#0E3733"><i class="ph ph-flag-checkered" style="font-size:20px;color:#155E56"></i>Race car insurance</a>
        <div style="height:1px;background:rgba(14,55,51,.09);margin:10px 12px"></div>
        <a href="Service-Area.dc.html" style="display:block;padding:11px 12px;border-radius:10px;color:#26403C;text-decoration:none" style-hover="background:#E6F2F0;color:#0E3733">Service Area</a>
        <a href="About.dc.html" style="display:block;padding:11px 12px;border-radius:10px;color:#26403C;text-decoration:none" style-hover="background:#E6F2F0;color:#0E3733">About</a>
        <a href="Reviews.dc.html" style="display:block;padding:11px 12px;border-radius:10px;color:#26403C;text-decoration:none" style-hover="background:#E6F2F0;color:#0E3733">Reviews</a>
        <a href="Contact.dc.html" style="display:block;padding:11px 12px;border-radius:10px;color:#26403C;text-decoration:none" style-hover="background:#E6F2F0;color:#0E3733">Contact</a>
        <a role="button" tabindex="0" data-demo-inert="call" style="margin-top:14px;display:flex;align-items:center;justify-content:center;gap:8px;background:#0E3733;color:#FFFFFF;text-decoration:none;font-size:16px;font-weight:600;padding:14px 20px;border-radius:999px;transition:background .2s cubic-bezier(.16,1,.3,1)" style-hover="background:#155E56">
          <i class="ph ph-phone-call" style="font-size:18px;color:#7CD1CA"></i>Call (214) 773-3938
        </a>
      </nav>
    </div>
  </sc-if>
</header>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { coverageOpen: false, mobileOpen: false };
  componentDidMount() {
    this.componentWillUnmount();
    // Close the mobile menu on Escape, and when the viewport grows past the breakpoint.
    this._onKey = (e) => { if (e.key === 'Escape' && this.state.mobileOpen) this.setState({ mobileOpen: false }); };
    document.addEventListener('keydown', this._onKey);
    this._mq = window.matchMedia('(min-width: 861px)');
    this._onMq = (e) => { if (e.matches && this.state.mobileOpen) this.setState({ mobileOpen: false }); };
    this._mq.addEventListener('change', this._onMq);
  }
  componentWillUnmount() {
    if (this._onKey) document.removeEventListener('keydown', this._onKey);
    if (this._mq && this._onMq) this._mq.removeEventListener('change', this._onMq);
    this._onKey = this._mq = this._onMq = null;
  }
  renderVals() {
    const mobileOpen = this.state.mobileOpen;
    return {
      coverageOpen: this.state.coverageOpen,
      openMenu: () => this.setState({ coverageOpen: true }),
      closeMenu: () => this.setState({ coverageOpen: false }),
      toggleMenu: () => this.setState({ coverageOpen: true }),
      mobileOpen,
      mobileClosed: !mobileOpen,
      mobileMenuLabel: mobileOpen ? 'Close menu' : 'Open menu',
      toggleMobile: () => this.setState((s) => ({ mobileOpen: !s.mobileOpen }))
    };
  }
}

</script>
</body>
</html>
