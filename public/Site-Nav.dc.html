<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="position:sticky;top:0;z-index:40;background:rgba(245,247,246,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(14,55,51,.09)">
  <div style="max-width:1340px;margin:0 auto;padding:10px clamp(18px,3.4vw,44px);min-height:72px;display:flex;flex-wrap:wrap;align-items:center;gap:clamp(14px,2.2vw,30px)">
    <a href="Home.dc.html" style="flex:none;display:block;line-height:0;text-decoration:none" aria-label="KayRich Insurance Agency, home">
      <img src="assets/kayrich-logo.png" alt="KayRich Insurance Agency" width="640" height="330" style="display:block;height:52px;width:auto">
    </a>
    <nav aria-label="Primary" style="flex:1 1 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:clamp(12px,1.6vw,24px);font-family:Geist,sans-serif;font-size:14.5px;font-weight:500;letter-spacing:-.005em">

      <div style="position:relative" onMouseEnter="{{ openMenu }}" onMouseLeave="{{ closeMenu }}">
        <button type="button" aria-haspopup="true" aria-expanded="{{ coverageOpen }}" onClick="{{ toggleMenu }}" style="display:inline-flex;align-items:center;gap:6px;background:none;border:none;padding:6px 2px;cursor:pointer;color:#26403C;font-family:Geist,sans-serif;font-size:14.5px;font-weight:500;border-bottom:1.5px solid transparent;white-space:nowrap" style-hover="color:#0E3733;border-bottom-color:#7CD1CA">
          Coverage<i class="ph ph-caret-down" style="font-size:12px"></i>
        </button>
        <sc-if value="{{ coverageOpen }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;top:100%;right:0;padding-top:12px;min-width:236px;animation:kr-fade .16s ease both">
          <div style="background:#FFFFFF;border:1px solid rgba(14,55,51,.12);border-radius:16px;box-shadow:0 22px 50px -24px rgba(14,55,51,.38);padding:10px;display:flex;flex-direction:column;gap:2px">
            <a href="Auto-Insurance.dc.html" style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#26403C;text-decoration:none;white-space:nowrap" style-hover="background:#E6F2F0;color:#0E3733"><i class="ph ph-car-profile" style="font-size:18px;color:#155E56"></i>Auto insurance</a>
            <a href="Home-Insurance.dc.html" style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#26403C;text-decoration:none;white-space:nowrap" style-hover="background:#E6F2F0;color:#0E3733"><i class="ph ph-house-line" style="font-size:18px;color:#155E56"></i>Home insurance</a>
            <a href="Life-Insurance.dc.html" style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#26403C;text-decoration:none;white-space:nowrap" style-hover="background:#E6F2F0;color:#0E3733"><i class="ph ph-heart" style="font-size:18px;color:#155E56"></i>Life insurance</a>
            <a href="Business-Insurance.dc.html" style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#26403C;text-decoration:none;white-space:nowrap" style-hover="background:#E6F2F0;color:#0E3733"><i class="ph ph-storefront" style="font-size:18px;color:#155E56"></i>Business insurance</a>
            <a href="Race-Car-Insurance.dc.html" style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#26403C;text-decoration:none;white-space:nowrap" style-hover="background:#E6F2F0;color:#0E3733"><i class="ph ph-flag-checkered" style="font-size:18px;color:#155E56"></i>Race car insurance</a>
          </div>
          </div>
        </sc-if>
      </div>

      <a href="Service-Area.dc.html" style="color:#26403C;text-decoration:none;white-space:nowrap;padding:6px 2px;border-bottom:1.5px solid transparent" style-hover="color:#0E3733;border-bottom-color:#7CD1CA">Service Area</a>
      <a href="About.dc.html" style="color:#26403C;text-decoration:none;white-space:nowrap;padding:6px 2px;border-bottom:1.5px solid transparent" style-hover="color:#0E3733;border-bottom-color:#7CD1CA">About</a>
      <a href="Reviews.dc.html" style="color:#26403C;text-decoration:none;white-space:nowrap;padding:6px 2px;border-bottom:1.5px solid transparent" style-hover="color:#0E3733;border-bottom-color:#7CD1CA">Reviews</a>
      <a href="Contact.dc.html" style="color:#26403C;text-decoration:none;white-space:nowrap;padding:6px 2px;border-bottom:1.5px solid transparent" style-hover="color:#0E3733;border-bottom-color:#7CD1CA">Contact</a>
      <a role="button" tabindex="0" data-demo-inert="call" style="display:inline-flex;align-items:center;gap:8px;background:#0E3733;color:#FFFFFF;text-decoration:none;font-family:Geist,sans-serif;font-size:14.5px;font-weight:600;padding:11px 20px;border-radius:999px;white-space:nowrap;transition:background .2s cubic-bezier(.16,1,.3,1),transform .12s ease" style-hover="background:#155E56" style-active="transform:scale(.98)">
        <i class="ph ph-phone-call" style="font-size:17px;color:#7CD1CA"></i>Call (214) 773-3938
      </a>
    </nav>
  </div>
</header>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { coverageOpen: false };
  renderVals() {
    return {
      coverageOpen: this.state.coverageOpen,
      openMenu: () => this.setState({ coverageOpen: true }),
      closeMenu: () => this.setState({ coverageOpen: false }),
      toggleMenu: () => this.setState({ coverageOpen: true })
    };
  }
}

</script>
</body>
</html>
